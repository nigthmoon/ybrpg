<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>夜白旅程 - 独立版</title>
	<link rel="stylesheet" href="./style.css"></link>
	<!-- 或者用另一种方式： -->
	<script>
		window.GAME_VERSION = 'v2.1.5';
	</script>
</head>
<body>
	<!-- 游戏主容器 -->
	<div id="ybrpg-root">
		<!-- 主内容区域 -->
		<div class="ybrpg-main-content">
			<!-- 主视图 (默认显示) -->
			<div id="main-view">
				<h2>游戏主界面</h2>
			</div>
						<!-- 新增存档界面 -->
			<div id="save-view">
				<!-- 存档界面内容将由JS动态生成 -->
			</div>

			<!-- 队伍视图 (默认隐藏，内容为空，由JS动态加载) -->
			<div id="team-view" style="display: none;">
			</div>

			<!-- 背包视图 (默认隐藏) -->
			<div id="bag-view" style="display: none;">
			</div>

			<!-- 副本视图 (默认隐藏) -->
			<div id="dungeon-view" style="display: none;">
			</div>

			<!-- 商店视图 (默认隐藏) -->
			<div id="shop-view" style="display: none;">
			</div>

			<!-- 设置视图 (默认隐藏) -->
			<div id="settings-view" style="display: none;">
			</div>

			<!-- 战斗视图 (默认隐藏) -->
			<div id="battle-view" style="display: none;">
			</div>
		</div>

		<!-- 底部导航栏 (战斗时隐藏) -->
		<div class="ybrpg-bottom-bar">
			<button class="ybrpg-nav-btn" id="btn-team">队伍</button>
			<button class="ybrpg-nav-btn" id="btn-bag">背包</button>
			<button class="ybrpg-nav-btn" id="btn-dungeon">副本</button>
			<button class="ybrpg-nav-btn" id="btn-shop">商店</button>
			<button class="ybrpg-nav-btn" id="btn-settings">设置</button>
		</div>
	</div>
	
	<!-- 引入宝物定义（需在 gameData.js 之前） -->
	<!-- <script src="./treasureList.js"></script> -->
	<script src="./equip.js"></script>
	
	<!-- 引入游戏数据管理 -->
	<script src="./gameData.js"></script>
	<!-- 引入独立版 mode.js -->
	<script src="./battle/battle_refactored.js"></script>
	<script src="./mode.js"></script>
	<script src="./characterList.js"></script>
	<script src="./contentList.js"></script>
	<script src="./eventList.js"></script>
	<script src="./charBreakthroughConfig.js"></script>
	<!-- <script src="./battle.js"></script> -->

</body>
</html>
